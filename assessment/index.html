<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a complimentary assessment — nata.</title><link rel="stylesheet" href="/styles.css"><body><header class="site-header wrap"><a class="wordmark" href="/">nata.</a><a href="/">Home</a></header><main class="wrap"><div class="intake"><h1>What keeps coming back to your desk?</h1><p>Request a complimentary assessment. Tell us a little about your business and where the friction is.</p><form id="intake"><label>Name<input name="name" required autocomplete="name"></label><label>Work email<input type="email" name="email" required autocomplete="email"></label><label>Company website<input type="url" name="website" required placeholder="https://"></label><label>Annual company revenue<select name="revenue" required><option value="">Select a range</option><option>Under US$1M</option><option>US$1M–5M</option><option>US$5M–20M</option><option>US$20M+</option></select></label><label>Budget for the right engagement<select name="budget" required><option value="">Select a range</option><option>Under US$5K</option><option>US$5K–15K</option><option>US$15K–50K</option><option>US$50K+</option><option>Still defining it</option></select></label><label>What feels harder than it should?<textarea name="challenge" rows="4" required></textarea></label><button>Request a complimentary assessment ↗</button><p id="status" role="status"></p></form></div></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#status'),b=e.target.querySelector('button');b.disabled=true;s.textContent='Sending…';try{const r=await fetch('/api/assessment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok)throw Error();s.textContent='Thank you. Your request has been received.';e.target.reset()}catch{s.textContent='Submission is not available yet. Your answers remain here; please try again later.'}finally{b.disabled=false}};</script></body></html>
